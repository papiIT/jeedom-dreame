name: Tests

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest requests
      - run: python -m pytest -q tests/python

  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
      - name: Syntaxe PHP
        run: find . -name "*.php" -print0 | xargs -0 -n1 php -l
      - name: Tests unitaires PHP
        run: php tests/php/run.php
      - name: Fichiers JSON valides
        run: |
          for f in $(find . -name "*.json" -not -path "./.git/*"); do
            php -r "json_decode(file_get_contents('$f')); exit(json_last_error() ? 1 : 0);" || { echo "JSON invalide : $f"; exit 1; }
          done
